services:
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  blazorweb:
    build:
      context: .
      dockerfile: docker/blazor/Dockerfile
      args:
        BLAZOR_PROJECT: src/Clients/BlazorWeb/BlazorWeb.csproj
    ports:
      - "${BLAZOR_HTTP_PORT:-8081}:8080"
    environment:
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080/}
    depends_on:
      - api
    restart: unless-stopped

  tutor-portal:
    build:
      context: .
      dockerfile: docker/blazor/Dockerfile
      args:
        BLAZOR_PROJECT: src/Clients/TutorPortalWeb/TutorPortalWeb.csproj
    ports:
      - "${TUTOR_PORTAL_HTTP_PORT:-8082}:8080"
    environment:
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080/}
    depends_on:
      - api
    restart: unless-stopped

  platform-web:
    build:
      context: .
      dockerfile: docker/blazor/Dockerfile
      args:
        BLAZOR_PROJECT: src/Clients/PlatformWeb/PlatformWeb.csproj
    ports:
      - "${PLATFORM_HTTP_PORT:-8083}:8080"
    environment:
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080/}
    depends_on:
      - api
    restart: unless-stopped

  clinic-site:
    build:
      context: .
      dockerfile: docker/blazor/Dockerfile
      args:
        BLAZOR_PROJECT: src/Clients/ClinicSiteWeb/ClinicSiteWeb.csproj
    ports:
      - "${CLINIC_SITE_HTTP_PORT:-8084}:8080"
    environment:
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8080/}
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
