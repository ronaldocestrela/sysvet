name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dotnet: ['10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SaaS_Veterinario.ci.slnf

      - name: Build
        run: dotnet build SaaS_Veterinario.ci.slnf --no-restore --configuration Release

      - name: Test
        run: dotnet test SaaS_Veterinario.ci.slnf --no-build --configuration Release --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults --logger trx -- RunConfiguration.MaxCpuCount=1

      - name: Merge coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: coveragereport
          reporttypes: 'HtmlInline;Cobertura;TextSummary'
          classfilters: '+*Domain*;+*Application*;-*.Tests*'

      - name: Coverage gate (Domain + Application)
        env:
          MIN_LINE_COVERAGE: '70'
        run: bash scripts/assert-coverage.sh coveragereport/Cobertura.xml

      - name: Publish Blazor PWA
        run: |
          dotnet publish src/Clients/BlazorWeb/BlazorWeb.csproj --configuration Release --output artifacts/blazorweb
          test -f artifacts/blazorweb/wwwroot/service-worker-assets.js
          test -f artifacts/blazorweb/wwwroot/manifest.json

      - name: Publish API
        run: dotnet publish src/API/API.csproj --configuration Release --no-build --output artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysvet-api-release
          path: artifacts/api

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Validate API container build
        run: docker build -f src/API/Dockerfile .
